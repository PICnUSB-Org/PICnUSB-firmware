name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licence:
    name: Licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install Google addlicense
        run: go install github.com/google/addlicense@v1.2.0
      - name: Check licence headers
        run: addlicense -check -ignore '_build/**' -ignore 'out/**' -ignore 'cmake/PICnUSB/**' .

  build:
    name: PIC16F1455 / XC8 3.10
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Download XC8 and device pack
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/xc8-installer.run" \
            https://ww1.microchip.com/downloads/aemDocuments/documents/DEV/ProductDocuments/SoftwareTools/xc8-v3.10-full-install-linux-x64-installer.run
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/device.atpack" \
            https://packs.download.microchip.com/Microchip.PIC12-16F1xxx_DFP.1.10.270.atpack
          echo "628803b96f468a5981d6bc1d0a5e6c7fa809e4d87e3cca961805e2a857f5846e  $RUNNER_TEMP/xc8-installer.run" | sha256sum --check
          echo "cf4f7a040259beea00ff06ea3a4152b62d1a7795a5d6c514a2c9d01736a1fd90  $RUNNER_TEMP/device.atpack" | sha256sum --check
      - name: Install XC8 and extract device pack
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/xc8-installer.run"
          sudo "$RUNNER_TEMP/xc8-installer.run" --mode unattended \
            --netservername localhost --prefix /opt/microchip/xc8/v3.10
          python3 -m zipfile -e "$RUNNER_TEMP/device.atpack" "$RUNNER_TEMP/dfp"
      - name: Configure
        run: >-
          cmake -S . -B _build/ci -G Ninja
          -DXC8_CC=/opt/microchip/xc8/v3.10/bin/xc8-cc
          -DDFP_PATH="$RUNNER_TEMP/dfp/xc8"
      - name: Build
        run: cmake --build _build/ci --verbose
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: PICnUSB-PIC16F1455
          path: |
            out/ci/PICnUSB/default.elf
            out/ci/PICnUSB/default.hex
          if-no-files-found: error
