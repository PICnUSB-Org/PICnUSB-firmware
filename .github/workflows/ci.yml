name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licence:
    name: Licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install Google addlicense
        run: go install github.com/google/addlicense@v1.2.0
      - name: Check licence headers
        run: addlicense -check -ignore '_build/**' -ignore 'out/**' -ignore 'cmake/PICnUSB/**' .

  build:
    name: MPLAB firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          npm install --global @mplab/cli@0.9.6
          mplab apps install cmake@4.5.0
          mplab apps install ninja@1.13.2
          mplab apps install make@4.4.1
      - name: Install XC8
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/xc8-installer.run" \
            https://ww1.microchip.com/downloads/aemDocuments/documents/DEV/ProductDocuments/SoftwareTools/xc8-v3.10-full-install-linux-x64-installer.run
          echo "628803b96f468a5981d6bc1d0a5e6c7fa809e4d87e3cca961805e2a857f5846e  $RUNNER_TEMP/xc8-installer.run" | sha256sum --check
          chmod +x "$RUNNER_TEMP/xc8-installer.run"
          sudo "$RUNNER_TEMP/xc8-installer.run" --mode unattended \
            --netservername localhost --prefix /opt/microchip/xc8/v3.10
      - name: Install MPLAB project packs
        run: mplab packs install --project .vscode/PICnUSB.mplab.json
      - name: Build MPLAB project
        run: >-
          mplab project build .vscode/PICnUSB.mplab.json --configuration default
          --toolchain /opt/microchip/xc8/v3.10
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: PICnUSB-PIC16F1455
          path: |
            out/PICnUSB/default.elf
            out/PICnUSB/default.hex
          if-no-files-found: error
